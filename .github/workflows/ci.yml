name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Build minified bundle
        run: make -C src/js build
      - name: Smoke test
        run: make -C src/js test

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Go build
        run: make -C src/go build
      - name: Go test
        run: make -C src/go test
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: JS build (for parity gate)
        run: make -C src/js build
      - name: Cross-implementation parity gate
        run: make -C src/go parity
      - name: Cross-implementation diagnostic-set parity gate
        run: make -C src/go parity-diagnostics
